l_simp_chinese:

 cpr_laamp_1000_success_employer_modifier: "精湛演出令人愉悦"
 cpr_laamp_1000_success_employer_modifier_desc: "该角色被一场极其精彩的演出所打动，暂时解除了统治的重担，并提升了其外交风采。"

 cpr_laamp_1000_failure_employer_modifier: "忍受糟糕演出"
 cpr_laamp_1000_failure_employer_modifier_desc: "该角色最近忍受了一场质量堪忧的娱乐表演，导致其在外交事务中更加易怒且难以沉住气。"

 cpr_laamp_1000_deception_success_employer_modifier: "不知不觉中被操纵"
 cpr_laamp_1000_deception_success_employer_modifier_desc: "该角色通过娱乐活动被巧妙操纵，自以为体验了真挚的情感，实则透露了弱点与秘密。其判断力在不知不觉中受到了损害。"

 cpr_laamp_1000_deception_failure_employer_modifier: "疑心加重"
 cpr_laamp_1000_deception_failure_employer_modifier_desc: "在发觉伪装成娱乐的操纵企图后，该角色变得更加警惕和多疑，使其更难被欺骗，但也更加紧张与偏执。"
